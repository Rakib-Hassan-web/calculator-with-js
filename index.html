<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- -----------css link---------- -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>



    <div class="calculator">


        <form>


            <div class="input">
                <input name="input" id="classs" type="text">
            </div>
            <div>
                <input type="button" value="AC" onclick="input.value = '' ">
                <input type="button" value="DE"  onclick="input.value.toString().slice(0,-1)">
                <!-- <input type="button" class="deletlast_char" value="DE"onclick="removeLastChar()"> -->
                <input type="button" value="." onclick="input.value += '.' ">
                <input type="button" value="/" onclick="input.value += '/' ">
            </div>
            <div>
                <input type="button" value="7" 
                id="seven">
                <input type="button" value="8"  id="eight">
                <input type="button" value="9"  id="nine">
                <input type="button" value="*"  onclick="input.value += '*' ">
            </div>
            <div>
                <input type="button" value="4" onclick="input.value += '4' ">
                <input type="button" value="5" onclick="input.value += '5' ">
                <input type="button" value="6" onclick="input.value += '6' ">
                <input type="button" value="-" onclick="input.value += '-' ">
            </div>
            <div>
                <input type="button" value="1" onclick="input.value += '1' " >
                <input type="button" value="2"  onclick="input.value += '2' ">
                <input type="button" value="3" onclick="input.value += '3' ">
                <input type="button" value="+" onclick="input.value += '+' ">
            </div>
            <div>
                <input type="button" value="00" onclick="input.value += '00' ">
                <input type="button" value="0" onclick="input.value += '0' ">
                <input type="button"  value="=" onclick="input.value = eval(input.value)  "   class="equal">

            </div>

        </form>



    </div>





    <!-- -------------scipt links-------- -->
    <script src="js/main.js"></script>
</body>

</html>
