<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator with html,cssand js</title>

    <!-- -----------css link---------- -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="calculator">

        <form>

            <div class="input">
                <input name="input" id="classs" type="text">
            </div>

            <!-- -----------------------row1 st-------------- -->

            <div class="row1">
                <input type="button" value="AC" onclick="clearbtn()" class="ac">
                <input type="button" value="DE" onclick="removeLastChar()" class="delet">
                <input type="button" value="." onclick="dot()" class="dot">
                <input type="button" value="÷" onclick="slash()" id="vag">
            </div>

            <!-- -----------------------row1 end-------------- -->

            <!-- -----------------------row2 st-------------- -->

            <div class="row2">
                <input type="button" value="7" id="seven">
                <input type="button" value="8" id="eight">
                <input type="button" value="9" id="nine">
                <input type="button" value="*" onclick="multiply()" class="gun">
            </div>

            <!-- -----------------------row2 end-------------- -->

            <!-- -----------------------row3 st-------------- -->

            <div class="row3">
                <input type="button" value="4" id="four">
                <input type="button" value="5" id="five">
                <input type="button" value="6" id="six">
                <input type="button" value="-" onclick="minas() " class="biyog">
            </div>

            <!-- -----------------------row3 end-------------- -->

            <!-- -----------------------row4 st-------------- -->

            <div class="row4">
                <input type="button" value="1" id="one">
                <input type="button" value="2" id="two">
                <input type="button" value="3" id="three">
                <input type="button" value="+" onclick="plus()" class="jog">
            </div>

            <!-- -----------------------row4 end-------------- -->

            <!-- -----------------------row5 st-------------- -->

            <div class="row5">
                <input type="button" value="00" id="doubleZero"        >
                <input type="button" value="0"  id="singlezero">
                <input type="button" value="=" onclick="soman()" class="equal">

            </div>
            <!-- -----------------------row5 end-------------- -->

        </form>

    </div>


    <!-- -------------scipt links-------- -->
    <script src="js/main.js"></script>
</body>

</html>
